name: Temp work order production route panel

on:
  push:
    branches:
      - feature/tmp-work-order-production-route-panel

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.0

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=optional --legacy-peer-deps

      - name: Apply production route panel split
        run: python .github/scripts/apply-work-order-production-route-panel.py

      - name: Format refactor
        working-directory: frontend
        run: npx prettier --write scripts/architecture-baseline.json src/modules/work-orders/components/WorkOrderProduction.tsx src/modules/work-orders/components/ProductionRoutePanel.tsx

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Check architecture
        working-directory: frontend
        run: npm run architecture:check

      - name: Lint refactor
        working-directory: frontend
        run: npx eslint src/modules/work-orders/components/WorkOrderProduction.tsx src/modules/work-orders/components/ProductionRoutePanel.tsx

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check diff hygiene
        run: git diff --check

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/scripts/architecture-baseline.json \
            frontend/src/modules/work-orders/components/WorkOrderProduction.tsx \
            frontend/src/modules/work-orders/components/ProductionRoutePanel.tsx
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git commit -m "refactor(work-orders): extract production route panel [skip ci]"
          git push
