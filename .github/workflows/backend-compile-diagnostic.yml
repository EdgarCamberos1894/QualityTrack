name: Backend Compile Diagnostic

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-compile-diagnostic.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: ./mvnw -DskipTests compile
      - name: Production workflow tests
        run: ./mvnw -Dtest=ProductionWorkflowServiceTest test
