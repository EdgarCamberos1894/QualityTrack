name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: write

jobs:
  quality:
    name: Frontend quality gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.0

      - name: Install dependencies
        run: npm ci --include=optional --legacy-peer-deps

      - name: Patch audited lockfile
        if: github.event_name == 'push'
        run: |
          npm audit fix --package-lock-only
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: patch vulnerable dependency lockfile [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check architecture
        run: npm run architecture:check

      - name: Collect changed frontend files
        id: changed
        shell: bash
        run: |
          files=$(git -C .. diff --name-only HEAD^ HEAD -- frontend | sed 's#^frontend/##' | grep -E '\.(js|jsx|ts|tsx|css|json|md|mjs|html)$' || true)
          lint_files=$(printf '%s\n' "$files" | grep -E '\.(js|jsx|ts|tsx)$' || true)
          {
            echo 'format_files<<EOF'
            echo "$files"
            echo 'EOF'
            echo 'lint_files<<EOF'
            echo "$lint_files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check formatting of changed files
        if: steps.changed.outputs.format_files != ''
        env:
          FORMAT_FILES: ${{ steps.changed.outputs.format_files }}
        run: |
          if ! printf '%s\n' "$FORMAT_FILES" | xargs npx prettier --check; then
            printf '%s\n' "$FORMAT_FILES" | xargs npx prettier --write
            git diff -- $FORMAT_FILES
            exit 1
          fi

      - name: Lint changed files
        if: steps.changed.outputs.lint_files != ''
        env:
          LINT_FILES: ${{ steps.changed.outputs.lint_files }}
        run: |
          printf '%s\n' "$LINT_FILES" | xargs npx eslint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
