name: Frontend Typecheck Diagnostic

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-typecheck-diagnostic.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.0
      - name: Install dependencies
        run: npm ci --include=optional --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
